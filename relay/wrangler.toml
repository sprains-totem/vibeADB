name = "vibeadb-relay"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Durable Object（SQLite 后端 = 免费计划可用）
# 部署：npx wrangler deploy（无需 KV / 无需 secret，密码端到端不经过边缘）
[durable_objects]
bindings = [{ name = "RELAY", class_name = "Relay" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]

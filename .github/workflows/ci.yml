name: ci

on:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - "worker/**"
      - "agent/**"
      - "protocol/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "android/**"
      - "worker/**"
      - "agent/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      STAGE: ${{ github.workspace }}/.ci-staging
    steps:
      - uses: actions/checkout@v4

      - name: Prepare staging
        run: |
          mkdir -p "$STAGE"
          echo "$(date -u +%T) job start" >> "$STAGE/android-progress.log"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Download cloudflared (arm64-v8a)
        shell: bash
        run: |
          set -o pipefail
          VER=$(curl -fsSL https://api.github.com/repos/cloudflare/cloudflared/releases/latest | jq -r .tag_name)
          {
            echo "cloudflared version: $VER"
            mkdir -p android/app/src/main/jniLibs/arm64-v8a
            curl -fsSL -o android/app/src/main/jniLibs/arm64-v8a/libcloudflared.so \
              "https://github.com/cloudflare/cloudflared/releases/download/${VER}/cloudflared-linux-arm64"
            ls -la android/app/src/main/jniLibs/arm64-v8a/
            file android/app/src/main/jniLibs/arm64-v8a/libcloudflared.so
          } 2>&1 | tee "$STAGE/android-cloudflared.log"
          echo "$(date -u +%T) cloudflared done" >> "$STAGE/android-progress.log"

      - name: Dependency diagnostic（shizuku/websocket 是否在编译类路径上）
        shell: bash
        working-directory: android
        run: |
          gradle --no-daemon :app:dependencies --configuration debugCompileClasspath 2>&1 \
            | grep -Ei "shizuku|Java-WebSocket|FAILED|Could not|ERROR|com.android.tools" \
            | tee "$STAGE/android-deps.log" || true
          echo "$(date -u +%T) deps diag done" >> "$STAGE/android-progress.log"

      - name: Unit tests
        shell: bash
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest 2>&1 | tee "$STAGE/android-test.log"
          echo "$(date -u +%T) unit tests done" >> "$STAGE/android-progress.log"

      - name: Build release APK（临时签名，仅验证可构建；正式发布见 release.yml）
        shell: bash
        working-directory: android
        env:
          VIBEADB_STORE_FILE: ${{ github.workspace }}/ci-keystore.jks
          VIBEADB_STORE_PASSWORD: vibeadb123
          VIBEADB_KEY_PASSWORD: vibeadb123
          VIBEADB_KEY_ALIAS: vibeadb
        run: |
          set -o pipefail
          keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/ci-keystore.jks" \
            -storepass vibeadb123 -keypass vibeadb123 -alias vibeadb \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=vibeADB" \
            > "$STAGE/android-build.log" 2>&1 || true
          gradle --no-daemon :app:assembleRelease 2>&1 | tee -a "$STAGE/android-build.log"
          echo "$(date -u +%T) assemble done" >> "$STAGE/android-progress.log"

      - uses: actions/upload-artifact@v4
        with:
          name: vibeADB-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Mark artifact uploaded
        run: echo "$(date -u +%T) artifact uploaded" >> "$STAGE/android-progress.log"

      - name: Report to ci-logs branch
        if: always()
        env:
          CONCLUSION: ${{ job.status }}
        run: |
          set -e
          {
            echo "job: android | conclusion: $CONCLUSION | sha: ${GITHUB_SHA:0:7}"
            echo "--- progress ---"
            cat "$STAGE/android-progress.log" || true
            echo "--- staging dir ---"
            ls -la "$STAGE" || true
          } > "$STAGE/android-${GITHUB_SHA:0:7}.marker"
          git config user.name "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --depth=1 origin ci-logs 2>/dev/null || true
            if git rev-parse -q --verify FETCH_HEAD >/dev/null 2>&1; then
              git checkout --detach FETCH_HEAD
            else
              git checkout --detach
            fi
            mkdir -p ci-logs
            cp -f "$STAGE"/* ci-logs/ || true
            git add -A -f ci-logs
            git commit -m "ci: android ${CONCLUSION} ${GITHUB_SHA:0:7}" --allow-empty
            if git push origin HEAD:refs/heads/ci-logs; then break; fi
            echo "push rejected (race), retry $attempt"
            sleep $((attempt * 5))
          done

  worker:
    runs-on: ubuntu-latest
    env:
      STAGE: ${{ github.workspace }}/.ci-staging
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - name: Prepare staging
        run: mkdir -p "$GITHUB_WORKSPACE/.ci-staging"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & test
        shell: bash
        run: |
          set -o pipefail
          npm install 2>&1 | tee "$GITHUB_WORKSPACE/.ci-staging/worker-install.log"
          npm test 2>&1 | tee "$GITHUB_WORKSPACE/.ci-staging/worker-test.log"

      - name: wrangler dry-run build
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy --dry-run --outdir=dist 2>&1 | tee "$GITHUB_WORKSPACE/.ci-staging/worker-build.log"

      - uses: actions/upload-artifact@v4
        with:
          name: vibeADB-worker
          path: |
            worker/dist/
            worker/wrangler.toml
            worker/DEPLOY.md

      - name: Report to ci-logs branch
        if: always()
        env:
          CONCLUSION: ${{ job.status }}
        run: |
          set -e
          STAGE="$GITHUB_WORKSPACE/.ci-staging"
          {
            echo "job: worker | conclusion: $CONCLUSION | sha: ${GITHUB_SHA:0:7}"
            echo "--- staging dir ---"
            ls -la "$STAGE" || true
          } > "$STAGE/worker-${GITHUB_SHA:0:7}.marker"
          git config user.name "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --depth=1 origin ci-logs 2>/dev/null || true
            if git rev-parse -q --verify FETCH_HEAD >/dev/null 2>&1; then
              git checkout --detach FETCH_HEAD
            else
              git checkout --detach
            fi
            cd "$(git rev-parse --show-toplevel)"
            mkdir -p ci-logs
            cp -f "$STAGE"/* ci-logs/ || true
            git add -A -f ci-logs
            git commit -m "ci: worker ${CONCLUSION} ${GITHUB_SHA:0:7}" --allow-empty
            if git push origin HEAD:refs/heads/ci-logs; then break; fi
            echo "push rejected (race), retry $attempt"
            sleep $((attempt * 5))
          done

  agent:
    runs-on: ubuntu-latest
    env:
      STAGE: ${{ github.workspace }}/.ci-staging
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - name: Prepare staging
        run: mkdir -p "$GITHUB_WORKSPACE/.ci-staging"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Vet & test
        shell: bash
        run: |
          set -o pipefail
          go mod tidy 2>&1 | tee "$GITHUB_WORKSPACE/.ci-staging/agent-mod.log"
          go vet ./... 2>&1 | tee "$GITHUB_WORKSPACE/.ci-staging/agent-vet.log"
          go test ./... 2>&1 | tee "$GITHUB_WORKSPACE/.ci-staging/agent-test.log"

      - name: Build binaries
        shell: bash
        run: |
          set -o pipefail
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 go build -trimpath -o dist/vibeadb-agent-linux-amd64 . 2>&1 | tee "$GITHUB_WORKSPACE/.ci-staging/agent-build.log"
          GOOS=linux   GOARCH=arm64 go build -trimpath -o dist/vibeadb-agent-linux-arm64 .
          GOOS=darwin  GOARCH=amd64 go build -trimpath -o dist/vibeadb-agent-darwin-amd64 .
          GOOS=darwin  GOARCH=arm64 go build -trimpath -o dist/vibeadb-agent-darwin-arm64 .
          GOOS=windows GOARCH=amd64 go build -trimpath -o dist/vibeadb-agent-windows-amd64.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: vibeADB-agent
          path: agent/dist/

      - name: Report to ci-logs branch
        if: always()
        env:
          CONCLUSION: ${{ job.status }}
        run: |
          set -e
          STAGE="$GITHUB_WORKSPACE/.ci-staging"
          {
            echo "job: agent | conclusion: $CONCLUSION | sha: ${GITHUB_SHA:0:7}"
            echo "--- staging dir ---"
            ls -la "$STAGE" || true
          } > "$STAGE/agent-${GITHUB_SHA:0:7}.marker"
          git config user.name "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --depth=1 origin ci-logs 2>/dev/null || true
            if git rev-parse -q --verify FETCH_HEAD >/dev/null 2>&1; then
              git checkout --detach FETCH_HEAD
            else
              git checkout --detach
            fi
            cd "$(git rev-parse --show-toplevel)"
            mkdir -p ci-logs
            cp -f "$STAGE"/* ci-logs/ || true
            git add -A -f ci-logs
            git commit -m "ci: agent ${CONCLUSION} ${GITHUB_SHA:0:7}" --allow-empty
            if git push origin HEAD:refs/heads/ci-logs; then break; fi
            echo "push rejected (race), retry $attempt"
            sleep $((attempt * 5))
          done

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Download cloudflared (arm64-v8a)
        shell: bash
        run: |
          set -o pipefail
          VER=$(curl -fsSL https://api.github.com/repos/cloudflare/cloudflared/releases/latest | jq -r .tag_name)
          echo "cloudflared version: $VER" | tee /tmp/android-cloudflared.log
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          curl -fsSL -o android/app/src/main/jniLibs/arm64-v8a/libcloudflared.so \
            "https://github.com/cloudflare/cloudflared/releases/download/${VER}/cloudflared-linux-arm64"
          file android/app/src/main/jniLibs/arm64-v8a/libcloudflared.so 2>&1 | tee -a /tmp/android-cloudflared.log

      - name: Prepare signing keystore
        id: ks
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "mode=secret" >> "$GITHUB_OUTPUT"
          else
            echo "mode=generated" >> "$GITHUB_OUTPUT"
            STORE_PASS=vibeadb123
            KEY_PASS=vibeadb123
            KEY_ALIAS=vibeadb
            keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/release.keystore" \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=vibeADB"
          fi
          SP="${STORE_PASS:-vibeadb123}"
          KP="${KEY_PASS:-vibeadb123}"
          KA="${KEY_ALIAS:-vibeadb}"
          {
            echo "store_pass=$SP"
            echo "key_pass=$KP"
            echo "key_alias=$KA"
          } >> "$GITHUB_OUTPUT"

      - name: Unit tests
        shell: bash
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest 2>&1 | tee /tmp/android-test.log

      - name: Build release APK
        shell: bash
        working-directory: android
        env:
          VIBEADB_STORE_FILE: ${{ github.workspace }}/release.keystore
          VIBEADB_STORE_PASSWORD: ${{ steps.ks.outputs.store_pass }}
          VIBEADB_KEY_PASSWORD: ${{ steps.ks.outputs.key_pass }}
          VIBEADB_KEY_ALIAS: ${{ steps.ks.outputs.key_alias }}
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleRelease 2>&1 | tee /tmp/android-build.log

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "vibeadb-${{ github.ref_name }}-release.apk"

      - name: Upload generated keystore（请下载保存并配置为 Secret，保证后续版本签名一致）
        if: steps.ks.outputs.mode == 'generated'
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release.keystore

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: vibeadb-*-release.apk

      - name: Report to ci-logs branch
        if: always()
        env:
          JOB_NAME: android-release
          CONCLUSION: ${{ job.status }}
        run: |
          set -e
          mkdir -p /tmp/ci-logs
          cp -f /tmp/android-*.log /tmp/ci-logs/ 2>/dev/null || true
          echo "job: android-release | conclusion: $CONCLUSION | tag: ${GITHUB_REF_NAME}" > "/tmp/ci-logs/android-release-${GITHUB_REF_NAME}.marker"
          git config user.name "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          git fetch --depth=1 origin ci-logs 2>/dev/null || true
          if git rev-parse -q --verify FETCH_HEAD >/dev/null 2>&1; then
            git checkout --detach FETCH_HEAD
          else
            git checkout --detach
          fi
          mkdir -p ci-logs
          cp -f /tmp/ci-logs/* ci-logs/ 2>/dev/null || true
          git add -A ci-logs
          git commit -m "ci: android-release ${CONCLUSION} ${GITHUB_REF_NAME}" --allow-empty
          git push origin HEAD:refs/heads/ci-logs

  worker-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & test & build
        shell: bash
        run: |
          set -o pipefail
          npm install 2>&1 | tee /tmp/worker-install.log
          npm test 2>&1 | tee /tmp/worker-test.log
          npx wrangler deploy --dry-run --outdir=dist 2>&1 | tee /tmp/worker-build.log

      - name: Package worker file
        run: |
          cd ..
          zip -r "vibeadb-worker-${{ github.ref_name }}.zip" worker/dist worker/wrangler.toml worker/DEPLOY.md

      - name: Attach worker file to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: vibeadb-worker-*.zip

      - name: Report to ci-logs branch
        if: always()
        env:
          JOB_NAME: worker-release
          CONCLUSION: ${{ job.status }}
        run: |
          set -e
          mkdir -p /tmp/ci-logs
          cp -f /tmp/worker-*.log /tmp/ci-logs/ 2>/dev/null || true
          echo "job: worker-release | conclusion: $CONCLUSION | tag: ${GITHUB_REF_NAME}" > "/tmp/ci-logs/worker-release-${GITHUB_REF_NAME}.marker"
          git config user.name "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          git fetch --depth=1 origin ci-logs 2>/dev/null || true
          if git rev-parse -q --verify FETCH_HEAD >/dev/null 2>&1; then
            git checkout --detach FETCH_HEAD
          else
            git checkout --detach
          fi
          cd "$(git rev-parse --show-toplevel)" 2>/dev/null || true
          mkdir -p ci-logs
          cp -f /tmp/ci-logs/* ci-logs/ 2>/dev/null || true
          git add -A ci-logs
          git commit -m "ci: worker-release ${CONCLUSION} ${GITHUB_REF_NAME}" --allow-empty
          git push origin HEAD:refs/heads/ci-logs

  agent-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Vet & test
        shell: bash
        run: |
          set -o pipefail
          go mod tidy 2>&1 | tee /tmp/agent-mod.log
          go vet ./... 2>&1 | tee /tmp/agent-vet.log
          go test ./... 2>&1 | tee /tmp/agent-test.log

      - name: Build binaries
        shell: bash
        run: |
          set -o pipefail
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 go build -trimpath -o dist/vibeadb-agent-linux-amd64 . 2>&1 | tee /tmp/agent-build.log
          GOOS=linux   GOARCH=arm64 go build -trimpath -o dist/vibeadb-agent-linux-arm64 .
          GOOS=darwin  GOARCH=amd64 go build -trimpath -o dist/vibeadb-agent-darwin-amd64 .
          GOOS=darwin  GOARCH=arm64 go build -trimpath -o dist/vibeadb-agent-darwin-arm64 .
          GOOS=windows GOARCH=amd64 go build -trimpath -o dist/vibeadb-agent-windows-amd64.exe .

      - name: Attach agent binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            agent/dist/vibeadb-agent-linux-amd64
            agent/dist/vibeadb-agent-linux-arm64
            agent/dist/vibeadb-agent-darwin-amd64
            agent/dist/vibeadb-agent-darwin-arm64
            agent/dist/vibeadb-agent-windows-amd64.exe

      - name: Report to ci-logs branch
        if: always()
        env:
          JOB_NAME: agent-release
          CONCLUSION: ${{ job.status }}
        run: |
          set -e
          mkdir -p /tmp/ci-logs
          cp -f /tmp/agent-*.log /tmp/ci-logs/ 2>/dev/null || true
          echo "job: agent-release | conclusion: $CONCLUSION | tag: ${GITHUB_REF_NAME}" > "/tmp/ci-logs/agent-release-${GITHUB_REF_NAME}.marker"
          git config user.name "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          git fetch --depth=1 origin ci-logs 2>/dev/null || true
          if git rev-parse -q --verify FETCH_HEAD >/dev/null 2>&1; then
            git checkout --detach FETCH_HEAD
          else
            git checkout --detach
          fi
          cd "$(git rev-parse --show-toplevel)" 2>/dev/null || true
          mkdir -p ci-logs
          cp -f /tmp/ci-logs/* ci-logs/ 2>/dev/null || true
          git add -A ci-logs
          git commit -m "ci: agent-release ${CONCLUSION} ${GITHUB_REF_NAME}" --allow-empty
          git push origin HEAD:refs/heads/ci-logs
